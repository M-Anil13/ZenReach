<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ReachFlow by NexZen · Console</title>
<link rel="icon" type="image/png" href="/static/logo.png" />
<style>
  html,body{margin:0;background:#070A12}
  #root:empty::after{content:"Loading…";color:#8A96AD;font-family:system-ui;display:block;padding:40px;text-align:center}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const T = { bg:"#070A12", panel:"#0D1220", line:"#1C2438", text:"#EAF0FA", dim:"#8A96AD",
  accent:"#4F7CFF", accent2:"#22D3EE", green:"#34D399", amber:"#FBBF24", red:"#F87171",
  grad:"linear-gradient(92deg,#4F7CFF,#22D3EE)" };

async function api(path, method="GET", body) {
  const opt = { method, headers: {} };
  if (body instanceof FormData) opt.body = body;
  else if (body) { opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
  const r = await fetch(path, opt);
  let j = {}; try { j = await r.json(); } catch(e){}
  if (!r.ok) throw new Error(j.error || ("HTTP "+r.status));
  return j;
}

const card = { background:T.panel, border:`1px solid ${T.line}`, borderRadius:14, padding:20, marginBottom:16 };
const inp = { width:"100%", boxSizing:"border-box", background:T.bg, color:T.text, border:`1px solid ${T.line}`, borderRadius:9, padding:"10px 12px", fontSize:13.5, marginBottom:10 };
const Btn = ({primary,danger,children,style,...p}) => <button {...p} style={{padding:"9px 16px",borderRadius:9,fontWeight:700,fontSize:13,cursor:"pointer",border:primary||danger?"none":`1px solid ${T.line}`,background:primary?T.grad:danger?T.red:"transparent",color:primary||danger?"#06101e":T.text,...style}}>{children}</button>;
const Badge = ({tone,children}) => { const c={ok:[T.green,"#0d2a1f"],warn:[T.amber,"#2b2310"],bad:[T.red,"#2b1414"],info:[T.accent2,"#0c2230"]}[tone||"info"]; return <span style={{background:c[1],color:c[0],padding:"2px 9px",borderRadius:999,fontSize:11,fontWeight:700}}>{children}</span>; };
const H1 = ({children}) => <h1 style={{fontSize:22,fontWeight:800,margin:"0 0 16px"}}>{children}</h1>;
const Stat = ({v,l,c}) => <div><div style={{fontSize:26,fontWeight:800,color:c||T.text}}>{v}</div><div style={{fontSize:12,color:T.dim}}>{l}</div></div>;

/* ===================== AUTH ===================== */
function Brand({sub}) {
  return <div style={{marginBottom:18}}>
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <img src="/static/logo.png" alt="" width="38" height="38" style={{borderRadius:10}}/>
      <div>
        <div style={{fontSize:22,fontWeight:800}}>Zen<span style={{background:T.grad,WebkitBackgroundClip:"text",color:"transparent"}}>Reach</span></div>
        <div style={{color:T.dim,fontSize:11.5,fontWeight:600}}>by NexZen</div>
      </div>
    </div>
    {sub && <div style={{color:T.dim,fontSize:12.5,marginTop:10}}>{sub}</div>}
  </div>;
}
function Auth({ onAuth }) {
  const [mode,setMode]=useState("login");
  const [f,setF]=useState({email:"",password:"",org_name:"",category:"retail",totp:""});
  const [need2fa,setNeed2fa]=useState(false);
  const [err,setErr]=useState("");
  const [info,setInfo]=useState("");
  const [reset,setReset]=useState({token:"",password:""});
  const submit=async()=>{ setErr(""); setInfo("");
    try {
      if(mode==="signup"){ await api("/api/auth/signup","POST",f); onAuth(); }
      else if(mode==="login"){ const r=await api("/api/auth/login","POST",f); if(r.need_2fa){setNeed2fa(true);setErr("Enter your 2FA code.");return;} onAuth(); }
      else if(mode==="forgot"){ const r=await api("/api/auth/reset/request","POST",{email:f.email});
        if(r.emailed){ setInfo("✅ Reset code emailed. Paste it below."); }
        else { setReset({...reset,token:r.reset_token||""}); setInfo("No email configured — code filled in below. Set a new password."); }
        setMode("reset"); }
      else if(mode==="reset"){ await api("/api/auth/reset/confirm","POST",{token:reset.token,password:reset.password});
        setInfo("✅ Password updated. Sign in."); setMode("login"); }
    } catch(e){ setErr(e.message); }
  };
  const labels={login:"Sign in",signup:"Create account & org",forgot:"Send reset code",reset:"Set new password"};
  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Inter,system-ui",color:T.text}}>
    <div style={{width:380,...card,padding:28}}>
      <Brand sub={"WhatsApp Campaign Suite — "+({login:"sign in",signup:"create account",forgot:"reset password",reset:"reset password"}[mode])}/>
      {mode==="signup" && <input style={inp} placeholder="Organization name" value={f.org_name} onChange={e=>setF({...f,org_name:e.target.value})}/>}
      {mode==="signup" && <select style={inp} value={f.category} onChange={e=>setF({...f,category:e.target.value})}><option value="retail">Retail</option><option value="services">Services</option><option value="education">Education</option><option value="events">Events</option><option value="general">General</option></select>}
      {mode!=="reset" && <input style={inp} placeholder="Email" value={f.email} onChange={e=>setF({...f,email:e.target.value})}/>}
      {(mode==="login"||mode==="signup") && <input style={inp} type="password" placeholder="Password (8+ chars)" value={f.password} onChange={e=>setF({...f,password:e.target.value})}/>}
      {mode==="login" && need2fa && <input style={inp} placeholder="2FA code" value={f.totp} onChange={e=>setF({...f,totp:e.target.value})}/>}
      {mode==="reset" && <input style={inp} placeholder="Reset code" value={reset.token} onChange={e=>setReset({...reset,token:e.target.value})}/>}
      {mode==="reset" && <input style={inp} type="password" placeholder="New password (8+ chars)" value={reset.password} onChange={e=>setReset({...reset,password:e.target.value})}/>}
      {err && <div style={{color:T.red,fontSize:12.5,marginBottom:10}}>{err}</div>}
      {info && <div style={{color:T.green,fontSize:12.5,marginBottom:10}}>{info}</div>}
      <Btn primary style={{width:"100%"}} onClick={submit}>{labels[mode]}</Btn>
      <div style={{textAlign:"center",marginTop:14,fontSize:12.5,color:T.dim}}>
        {mode==="login" && <span><span style={{cursor:"pointer",color:T.accent2}} onClick={()=>{setMode("forgot");setErr("");setInfo("");}}>Forgot password?</span> · <span style={{cursor:"pointer"}} onClick={()=>{setMode("signup");setErr("");}}>Sign up</span></span>}
        {mode==="signup" && <span style={{cursor:"pointer"}} onClick={()=>{setMode("login");setErr("");}}>Have an account? Sign in</span>}
        {(mode==="forgot"||mode==="reset") && <span style={{cursor:"pointer"}} onClick={()=>{setMode("login");setErr("");setInfo("");}}>← Back to sign in</span>}
      </div>
    </div>
  </div>;
}

/* ===================== ONBOARDING PREREQS ===================== */
function Prereqs({onDone}){
  const [p,setP]=useState(null);const [gst,setGst]=useState("");const [chk,setChk]=useState({});const [err,setErr]=useState("");
  useEffect(()=>{api("/api/onboarding/prereqs").then(d=>{setP(d);setGst(d.gst_number||"");});},[]);
  if(!p) return null;
  if(p.acknowledged){ if(onDone)onDone(); return null; }
  const allChecked=p.items.every(i=>chk[i.key]);
  const ack=async()=>{try{await api("/api/onboarding/prereqs","POST",{gst_number:gst});onDone&&onDone();location.reload();}catch(e){setErr(e.message);}};
  return <div style={{...card,borderColor:T.amber}}>
    <div style={{fontWeight:700,marginBottom:8}}>Before you connect — prerequisites</div>
    {p.items.map(i=><label key={i.key} style={{display:"block",fontSize:13,marginBottom:8,color:T.text}}>
      <input type="checkbox" checked={!!chk[i.key]} onChange={e=>setChk({...chk,[i.key]:e.target.checked})}/> {i.label}</label>)}
    <div style={{color:T.dim,fontSize:12,margin:"4px 0 6px"}}>GST number (mandatory for Indian businesses)</div>
    <input style={inp} placeholder="e.g. 22AAAAA0000A1Z5" value={gst} onChange={e=>setGst(e.target.value)}/>
    {err && <div style={{color:T.red,fontSize:12.5,marginBottom:8}}>{err}</div>}
    <Btn primary disabled={!allChecked||!gst} onClick={ack} style={{opacity:(allChecked&&gst)?1:.5}}>Acknowledge & continue</Btn>
  </div>;
}

/* ===================== CREDENTIALS ===================== */
function Credentials() {
  const [c,setC]=useState({token:"",phone_id:"",waba_id:""});
  const [state,setState]=useState(null);
  const [cur,setCur]=useState(null);
  const [es,setEs]=useState(null);          // embedded-signup config
  const [ready,setReady]=useState(false);   // prereqs acknowledged
  const esData=useRef({phone_number_id:"",waba_id:""});
  const reload=()=>api("/api/credentials").then(setCur).catch(()=>{});
  useEffect(()=>{reload();api("/api/credentials/embedded/config").then(setEs).catch(()=>{});},[]);

  const verify=async()=>{ setState("busy");
    try{ const r=await api("/api/credentials/verify","POST",c); setState(r); reload(); }
    catch(e){ setState({ok:false,error:e.message}); }
  };

  const launchEmbedded=()=>{
    // capture phone_number_id + waba_id from Meta's popup event
    window.addEventListener("message",(ev)=>{
      try{ const d=JSON.parse(ev.data); if(d.type==="WA_EMBEDDED_SIGNUP" && d.data){ esData.current={phone_number_id:d.data.phone_number_id,waba_id:d.data.waba_id}; } }catch(_){}
    });
    const start=()=>window.FB.login(async (resp)=>{
      const code=resp.authResponse&&resp.authResponse.code;
      if(!code){ setState({ok:false,error:"Signup cancelled."}); return; }
      setState("busy");
      try{ const r=await api("/api/credentials/embedded/exchange","POST",{code,...esData.current}); setState(r); reload(); }
      catch(e){ setState({ok:false,error:e.message}); }
    },{config_id:es.config_id,response_type:"code",override_default_response_type:true,extras:{setup:{}}});
    if(window.FB){ start(); return; }
    // load FB SDK once
    window.fbAsyncInit=function(){ window.FB.init({appId:es.app_id,version:es.graph_version,cookie:true,xfbml:false}); start(); };
    const s=document.createElement("script"); s.src="https://connect.facebook.net/en_US/sdk.js"; s.async=true; document.body.appendChild(s);
  };

  return <div><H1>API settings</H1>
    {cur && cur.connected && <div style={{...card,color:T.green,background:"#0d2a1f"}}>✅ Connected: <b>{cur.verified_name}</b> ({cur.display_number}) · health {cur.health}</div>}
    {!ready && <Prereqs onDone={()=>setReady(true)}/>}

    {/* PRIMARY: Embedded Signup */}
    <div style={card}>
      <div style={{fontWeight:700,marginBottom:6}}>Connect WhatsApp</div>
      {es && es.enabled
        ? <div><div style={{fontSize:12.5,color:T.dim,marginBottom:10}}>Create or connect your WhatsApp Business Account in one popup — no developer portal, no copying tokens.</div>
            <Btn primary onClick={launchEmbedded}>🟢 Connect with Facebook</Btn></div>
        : <div style={{fontSize:12.5,color:T.dim}}>⏳ Embedded Signup activates once NexZen's Meta App Review + Tech-Provider setup is complete. Until then, use manual entry below.</div>}
    </div>

    {/* FALLBACK: manual entry */}
    <div style={card}>
      <div style={{fontWeight:700,marginBottom:8}}>Manual credentials <span style={{fontSize:11,color:T.dim,fontWeight:400}}>(fallback / existing WABA)</span></div>
      <div style={{color:T.dim,fontSize:12,marginBottom:6}}>Permanent Access Token</div>
      <input style={inp} type="password" placeholder="EAAG…" value={c.token} onChange={e=>setC({...c,token:e.target.value})}/>
      <div style={{color:T.dim,fontSize:12,marginBottom:6}}>Phone Number ID</div>
      <input style={inp} value={c.phone_id} onChange={e=>setC({...c,phone_id:e.target.value})}/>
      <div style={{color:T.dim,fontSize:12,marginBottom:6}}>WABA ID</div>
      <input style={inp} value={c.waba_id} onChange={e=>setC({...c,waba_id:e.target.value})}/>
      <Btn primary onClick={verify} disabled={state==="busy"}>{state==="busy"?"Verifying…":"Save & verify"}</Btn>
      {state && state!=="busy" && <div style={{marginTop:12,fontSize:13,color:state.ok?T.green:T.red}}>{state.ok?`✅ ${state.name||"Connected"}${state.tier?` · tier ${state.tier}`:""}`:`❌ ${state.error}${state.fix?" — "+state.fix:""}`}</div>}
      <div style={{fontSize:11.5,color:T.dim,marginTop:12}}>🔒 Token stored AES-256-GCM encrypted server-side; never returned to the browser.</div>
    </div>
  </div>;
}

/* ===================== CONTACTS ===================== */
function Contacts() {
  const [parsed,setParsed]=useState(null);
  const [map,setMap]=useState({phone_col:-1,name_col:-1,default_cc:"91",list_name:"",opt_in:true});
  const [result,setResult]=useState(null);
  const [list,setList]=useState([]);
  const fileRef=useRef();
  const load=()=>api("/api/contacts").then(d=>setList(d.contacts));
  useEffect(()=>{load();},[]);
  const onFile=async f=>{ const fd=new FormData(); fd.append("file",f);
    const p=await api("/api/contacts/parse","POST",fd); setParsed(p); setMap({...map,phone_col:p.phone_col,name_col:p.name_col}); };
  const doImport=async()=>{ const r=await api("/api/contacts/import","POST",{token:parsed.all_rows_token,...map});
    setResult(r); setParsed(null); load(); };
  return <div><H1>Contacts</H1>
    <div style={card}>
      <Btn onClick={()=>fileRef.current.click()}>📄 Upload sheet (.xlsx/.csv)</Btn>
      <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={e=>e.target.files[0]&&onFile(e.target.files[0])}/>
      {parsed && <div style={{marginTop:14}}>
        <div style={{color:T.dim,fontSize:12.5,marginBottom:8}}>{parsed.total} rows · pick columns</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <select style={{...inp,width:160}} value={map.phone_col} onChange={e=>setMap({...map,phone_col:+e.target.value})}>{parsed.headers.map((h,i)=><option key={i} value={i}>📞 {h}</option>)}</select>
          <select style={{...inp,width:160}} value={map.name_col} onChange={e=>setMap({...map,name_col:+e.target.value})}><option value={-1}>— name —</option>{parsed.headers.map((h,i)=><option key={i} value={i}>{h}</option>)}</select>
          <input style={{...inp,width:130}} placeholder="cc 91" value={map.default_cc} onChange={e=>setMap({...map,default_cc:e.target.value})}/>
          <input style={{...inp,width:160}} placeholder="List name" value={map.list_name} onChange={e=>setMap({...map,list_name:e.target.value})}/>
        </div>
        <label style={{fontSize:12.5,color:T.dim,display:"block",margin:"4px 0 10px"}}><input type="checkbox" checked={map.opt_in} onChange={e=>setMap({...map,opt_in:e.target.checked})}/> Contacts are opted-in (consent recorded)</label>
        <Btn primary onClick={doImport}>Import</Btn>
      </div>}
      {result && <div style={{marginTop:12,fontSize:13,color:T.green}}>✅ {result.valid} imported · {result.duplicates} dups · {result.invalid} invalid · {result.suppressed_skipped} suppressed-skipped</div>}
    </div>
    <div style={card}>
      <div style={{fontWeight:700,marginBottom:10}}>Contacts ({list.length})</div>
      {list.slice(0,50).map(c=><div key={c.id} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${T.line}`,fontSize:13}}>
        <span>{c.name||"—"} <span style={{color:T.dim}}>· {c.phone}</span></span>
        <span>{c.opt_in?<Badge tone="ok">opted-in</Badge>:<Badge tone="warn">no opt-in</Badge>} <span style={{color:T.dim,fontSize:11,marginLeft:6}}>{c.country}</span></span>
      </div>)}
    </div>
  </div>;
}

/* ===================== TEMPLATES ===================== */
function Templates() {
  const [gallery,setGallery]=useState([]);
  const [mine,setMine]=useState([]);
  const [nt,setNt]=useState({name:"",category:"MARKETING",language:"en_US",body:""});
  const load=()=>api("/api/templates").then(d=>setMine(d.templates));
  useEffect(()=>{api("/api/templates/gallery").then(d=>setGallery(d.gallery));load();},[]);
  const create=async()=>{ await api("/api/templates","POST",nt); setNt({...nt,name:"",body:""}); load(); };
  const sync=async()=>{ try{await api("/api/templates/sync","POST",{});load();}catch(e){alert(e.message);} };
  return <div><H1>Templates</H1>
    <div style={card}>
      <div style={{fontWeight:700,marginBottom:10}}>Create & submit to Meta</div>
      <input style={inp} placeholder="template_name" value={nt.name} onChange={e=>setNt({...nt,name:e.target.value})}/>
      <div style={{display:"flex",gap:10}}>
        <select style={{...inp,width:160}} value={nt.category} onChange={e=>setNt({...nt,category:e.target.value})}><option>MARKETING</option><option>UTILITY</option><option>AUTHENTICATION</option></select>
        <input style={{...inp,width:120}} value={nt.language} onChange={e=>setNt({...nt,language:e.target.value})}/>
      </div>
      <textarea style={{...inp,height:80}} placeholder="Body with {{1}} {{2}}" value={nt.body} onChange={e=>setNt({...nt,body:e.target.value})}/>
      <Btn primary onClick={create}>Create</Btn> <Btn onClick={sync}>↻ Sync from Meta</Btn>
    </div>
    <div style={card}>
      <div style={{fontWeight:700,marginBottom:10}}>My templates</div>
      {mine.map(t=><div key={t.id} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${T.line}`,fontSize:13}}>
        <span>{t.name} <span style={{color:T.dim}}>· {t.category}</span></span>
        <Badge tone={t.status==="APPROVED"?"ok":t.status==="REJECTED"?"bad":"warn"}>{t.status}</Badge>
      </div>)}
      {!mine.length && <div style={{color:T.dim,fontSize:12.5}}>None yet. Create one or sync.</div>}
    </div>
    <div style={card}>
      <div style={{fontWeight:700,marginBottom:10}}>Gallery (approval-friendly)</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:10}}>
        {gallery.map(t=><div key={t.label} style={{border:`1px solid ${T.line}`,borderRadius:10,padding:12}}>
          <div style={{fontWeight:700,fontSize:13}}>{t.emoji} {t.label} <Badge tone="info">{t.category}</Badge></div>
          <div style={{color:T.dim,fontSize:12,marginTop:6,lineHeight:1.5}}>{t.text}</div>
          <Btn style={{marginTop:8,fontSize:12,padding:"5px 10px"}} onClick={()=>setNt({name:t.label.toLowerCase().replace(/ /g,"_"),category:t.category,language:"en_US",body:t.text})}>Use</Btn>
        </div>)}
      </div>
    </div>
  </div>;
}

/* ===================== CAMPAIGN ===================== */
function Campaign() {
  const [lists,setLists]=useState([]);
  const [tmpls,setTmpls]=useState([]);
  const [f,setF]=useState({name:"",list_id:"",template:"",lang:"en_US",throughput:20,warmup:false,opt_in_attested:false});
  const [pf,setPf]=useState(null);
  const [job,setJob]=useState(null);
  const poll=useRef();
  useEffect(()=>{api("/api/lists").then(d=>setLists(d.lists));api("/api/templates").then(d=>setTmpls(d.templates));return()=>clearInterval(poll.current);},[]);
  const preflight=async()=>setPf((await api("/api/campaigns/preflight","POST",f)));
  const launch=async()=>{ try{
    const r=await api("/api/campaigns","POST",f); setJob({id:r.campaign_id,demo:r.demo});
    poll.current=setInterval(async()=>{ const s=await api(`/api/campaigns/${r.campaign_id}/status`);
      setJob(j=>({...j,...s})); if(!s.running && ["done","cancelled"].includes(s.status)) clearInterval(poll.current);
    },500);
  }catch(e){alert(e.message);} };
  return <div><H1>New campaign</H1>
    <div style={card}>
      <input style={inp} placeholder="Campaign name" value={f.name} onChange={e=>setF({...f,name:e.target.value})}/>
      <select style={inp} value={f.list_id} onChange={e=>setF({...f,list_id:e.target.value})}><option value="">— pick list —</option>{lists.map(l=><option key={l.id} value={l.id}>{l.name} ({l.count})</option>)}</select>
      <select style={inp} value={f.template} onChange={e=>setF({...f,template:e.target.value})}><option value="">— template (demo: any) —</option>{tmpls.map(t=><option key={t.id} value={t.name}>{t.name} · {t.status}</option>)}</select>
      <div style={{display:"flex",gap:10}}>
        <input style={{...inp,width:120}} type="number" value={f.throughput} onChange={e=>setF({...f,throughput:+e.target.value})} placeholder="msg/sec"/>
        <label style={{fontSize:12.5,color:T.dim}}><input type="checkbox" checked={f.warmup} onChange={e=>setF({...f,warmup:e.target.checked})}/> warmup</label>
      </div>
      <label style={{fontSize:12.5,color:T.amber,display:"block",margin:"6px 0"}}><input type="checkbox" checked={f.opt_in_attested} onChange={e=>setF({...f,opt_in_attested:e.target.checked})}/> I attest this list is opted-in</label>
      <Btn onClick={preflight}>Run pre-flight</Btn> <Btn primary onClick={launch} disabled={!f.opt_in_attested}>Launch</Btn>
    </div>
    {pf && <div style={card}>
      <div style={{fontWeight:700,marginBottom:8}}>Campaign health {pf.ok?<Badge tone="ok">ready</Badge>:<Badge tone="bad">blocked</Badge>}</div>
      {pf.checks.map(c=><div key={c.key} style={{fontSize:13,padding:"3px 0"}}>{c.pass?"✅":"⛔"} {c.label}</div>)}
    </div>}
    {job && <div style={card}>
      <div style={{fontWeight:700}}>Campaign {job.running?"running…":"finished"} {job.demo&&<Badge tone="warn">demo</Badge>}</div>
      <div style={{display:"flex",gap:24,marginTop:12}}>
        <Stat v={job.sent||0} l="sent" c={T.green}/><Stat v={job.delivered||0} l="delivered" c={T.accent2}/>
        <Stat v={job.failed||0} l="failed" c={T.red}/><Stat v={job.skipped||0} l="skipped" c={T.amber}/>
        <Stat v={job.queued||0} l="queued"/>
      </div>

  return <div><H1>Automation journeys</H1>
    <div style={{fontSize:12.5,color:T.dim,marginBottom:10}}>Trigger → conditions → actions. Visual drag-drop canvas coming soon; define the node graph as JSON for now.</div>
    <div style={card}><input style={inp} placeholder="Journey name" value={f.name} onChange={e=>setF({...f,name:e.target.value})}/>
      <select style={inp} value={f.trigger_type} onChange={e=>setF({...f,trigger_type:e.target.value})}>{triggers.map(t=><option key={t}>{t}</option>)}</select>
      <textarea style={{...inp,height:120,fontFamily:"monospace",fontSize:12}} value={f.graph} onChange={e=>setF({...f,graph:e.target.value})}/>
      <Btn primary onClick={create}>Create journey</Btn>
    </div>
    {list.map(j=><div key={j.id} style={card}><b>{j.name}</b> <Badge tone={j.status==="active"?"ok":"warn"}>{j.status}</Badge> <span style={{color:T.dim,fontSize:12}}>· trigger {j.trigger_type} · {j.runs} runs</span></div>)}
  </div>;
}
function Capture(){
  const [forms,setForms]=useState([]);const [f,setF]=useState({name:"",source_tag:"website"});
  const load=()=>api("/api/capture/forms").then(d=>setForms(d.forms)).catch(()=>{});
  useEffect(()=>{load();},[]);
  const create=async()=>{const r=await api("/api/capture/forms","POST",{...f,fields:["name","phone"]});alert("Embed URL: "+r.embed+"\nWidget: "+r.widget);load();};
  return <div><H1>Lead capture</H1>
    <div style={card}><input style={inp} placeholder="Form name" value={f.name} onChange={e=>setF({...f,name:e.target.value})}/>
      <input style={inp} placeholder="source tag" value={f.source_tag} onChange={e=>setF({...f,source_tag:e.target.value})}/>
      <Btn primary onClick={create}>Create form + widget</Btn>
      <div style={{fontSize:12,color:T.dim,marginTop:8}}>Each form gives a public submit URL + an embeddable floating WhatsApp widget for your website.</div>
    </div>
    {forms.map(x=><div key={x.id} style={card}><b>{x.name}</b> <span style={{color:T.dim,fontSize:12}}>· /capture/{x.id} · source {x.source_tag}</span></div>)}
  </div>;
}
function Integrations(){
  const [list,setList]=useState([]);const [gated,setGated]=useState(false);const [kinds,setKinds]=useState([]);const [k,setK]=useState("webhook");
  const load=()=>api("/api/integrations").then(d=>{setList(d.integrations);setKinds(d.kinds);}).catch(()=>{});
  useEffect(()=>{load();},[]);
  const create=async()=>{try{const r=await api("/api/integrations","POST",{kind:k,name:k});alert("Inbound URL (paste in Zapier/Make/Woo/Sheets):\n"+r.inbound_url);load();}catch(e){if(e.message.includes("plan"))setGated(true);else alert(e.message);}};
  if(gated) return <div><H1>Integrations</H1><Upgrade feature="Integrations"/></div>;
  return <div><H1>Integrations</H1>
    <div style={{fontSize:12.5,color:T.dim,marginBottom:10}}>Connect Zapier, Make, Pabbly, Google Sheets, WooCommerce, Shopify and CTWA ad leads via incoming webhooks. Each gives a unique inbound URL.</div>
    <div style={card}><select style={inp} value={k} onChange={e=>setK(e.target.value)}>{kinds.map(x=><option key={x}>{x}</option>)}</select><Btn primary onClick={create}>Create connection</Btn></div>
    {list.map(x=><div key={x.id} style={card}><b>{x.name}</b> <Badge tone="info">{x.kind}</Badge><div style={{fontSize:11,color:T.dim,fontFamily:"monospace",marginTop:4,wordBreak:"break-all"}}>{x.inbound_url}</div></div>)}
  </div>;
}
function Affiliate(){
  const [d,setD]=useState(null);
  const load=()=>api("/api/affiliate/dashboard").then(setD).catch(()=>{});
  useEffect(()=>{load();},[]);
  const join=async()=>{await api("/api/affiliate/join","POST",{});load();};
  if(!d) return <div><H1>Affiliate</H1><div style={{color:T.dim}}>Loading…</div></div>;
  if(!d.joined) return <div><H1>Affiliate program</H1><div style={card}>Earn {25}% recurring commission for every org you refer.<div style={{marginTop:10}}><Btn primary onClick={join}>Join program</Btn></div></div></div>;
  return <div><H1>Affiliate program</H1>
    <div style={card}>Your link:<div style={{fontFamily:"monospace",fontSize:12,color:T.accent2,marginTop:4,wordBreak:"break-all"}}>{d.referral_link}</div></div>
    <div style={{display:"flex",gap:10}}>
      <div style={{...card,flex:1}}><Stat v={d.signups} l="signups"/></div>
      <div style={{...card,flex:1}}><Stat v={d.paying} l="paying" c={T.green}/></div>
      <div style={{...card,flex:1}}><Stat v={"₹"+d.earned_inr} l="earned" c={T.accent2}/></div>
    </div>
  </div>;
}

/* ===================== PROFILE & SETTINGS ===================== */
function Profile({me,reload}) {
  const [name,setName]=useState(me.user.name||"");
  const [pw,setPw]=useState({current_password:"",new_password:""});
  const [msg,setMsg]=useState("");
  const saveName=async()=>{try{await api("/api/auth/profile","POST",{name});setMsg("✅ Name updated");reload();}catch(e){setMsg("❌ "+e.message);}};
  const savePw=async()=>{try{await api("/api/auth/profile","POST",pw);setMsg("✅ Password changed");setPw({current_password:"",new_password:""});}catch(e){setMsg("❌ "+e.message);}};
  return <div>
    <div style={card}><div style={{fontWeight:700,marginBottom:10}}>Your details</div>
      <div style={{color:T.dim,fontSize:12,marginBottom:6}}>Email (sign-in, cannot change)</div>
      <input style={{...inp,opacity:.6}} value={me.user.email} disabled/>
      <div style={{color:T.dim,fontSize:12,marginBottom:6}}>Display name</div>
      <input style={inp} value={name} onChange={e=>setName(e.target.value)}/>
      <Btn primary onClick={saveName}>Save name</Btn>
    </div>
    <div style={card}><div style={{fontWeight:700,marginBottom:10}}>Change password</div>
      <input style={inp} type="password" placeholder="Current password" value={pw.current_password} onChange={e=>setPw({...pw,current_password:e.target.value})}/>
      <input style={inp} type="password" placeholder="New password (8+ chars)" value={pw.new_password} onChange={e=>setPw({...pw,new_password:e.target.value})}/>
      <Btn primary onClick={savePw}>Update password</Btn>
    </div>
    {msg && <div style={{fontSize:13,color:msg[0]==="✅"?T.green:T.red}}>{msg}</div>}
  </div>;
}
function SmtpCfg() {
  const [c,setC]=useState({user:"",pass:"",server:"smtp.hostinger.com",port:"465"});
  const [cur,setCur]=useState(null);const [msg,setMsg]=useState("");
  useEffect(()=>{api("/api/settings/smtp").then(d=>{setCur(d);setC(x=>({...x,user:d.user,server:d.server,port:d.port}));}).catch(()=>{});},[]);
  const save=async()=>{try{await api("/api/settings/smtp","POST",c);setMsg("✅ SMTP saved — invites now email automatically.");api("/api/settings/smtp").then(setCur);}catch(e){setMsg("❌ "+e.message);}};
  return <div style={card}>
    <div style={{fontWeight:700,marginBottom:6}}>Email / SMTP (optional)</div>
    <div style={{fontSize:12.5,color:T.dim,marginBottom:12,lineHeight:1.5}}>Add SMTP to <b>send team invitations automatically by email</b>. Leave empty and invites still work — you just share the join link manually. {cur&&cur.configured&&<Badge tone="ok">configured</Badge>}</div>
    <input style={inp} placeholder="SMTP user (you@domain.com)" value={c.user} onChange={e=>setC({...c,user:e.target.value})}/>
    <input style={inp} type="password" placeholder="SMTP password" value={c.pass} onChange={e=>setC({...c,pass:e.target.value})}/>
    <div style={{display:"flex",gap:10}}>
      <input style={{...inp,flex:1}} placeholder="server" value={c.server} onChange={e=>setC({...c,server:e.target.value})}/>
      <input style={{...inp,width:90}} placeholder="port" value={c.port} onChange={e=>setC({...c,port:e.target.value})}/>
    </div>
    <Btn primary onClick={save}>Save SMTP</Btn>
    {msg && <div style={{fontSize:13,marginTop:10,color:msg[0]==="✅"?T.green:T.red}}>{msg}</div>}
  </div>;
}
function Settings({me}) {
  const role=(me.orgs.find(o=>o.id===me.active_org)||{}).role||"viewer";
  const isOwner=role==="owner";
  const isAdmin=role==="owner"||role==="admin";
  const tabs=[["profile","Profile"],["connections","Connections"]];
  if(isOwner) tabs.push(["email","Email / SMTP"]);
  tabs.push(["billing","Billing"]);
  const [tab,setTab]=useState("profile");
  return <div><H1>Settings</H1>
    <div style={{display:"flex",gap:6,marginBottom:18,flexWrap:"wrap"}}>
      {tabs.map(([id,l])=><div key={id} onClick={()=>setTab(id)} style={{padding:"7px 14px",borderRadius:999,cursor:"pointer",fontSize:13,fontWeight:600,background:tab===id?"rgba(79,124,255,.16)":T.panel,color:tab===id?T.accent:T.dim,border:`1px solid ${tab===id?T.accent:T.line}`}}>{l}</div>)}
    </div>
    {tab==="profile" && <Profile me={me} reload={()=>location.reload()}/>}
    {tab==="connections" && <div>
      {isAdmin ? <Credentials/> : <div style={card}>WhatsApp credentials are managed by admins.</div>}
      <div style={{height:8}}/>
      {isAdmin ? <Keys/> : <div style={card}>API keys are managed by admins.</div>}
    </div>}
    {tab==="email" && isOwner && <SmtpCfg/>}
    {tab==="billing" && <Billing/>}
  </div>;
}

/* ===================== SHELL ===================== */
function App() {
  const [me,setMe]=useState(undefined);
  const [view,setView]=useState("dashboard");
  const [menu,setMenu]=useState(false);
  const loadMe=()=>api("/api/auth/me").then(setMe).catch(()=>setMe({authenticated:false}));
  useEffect(()=>{loadMe();},[]);
  if(me===undefined) return null;
  if(!me.authenticated) return <Auth onAuth={loadMe}/>;
  const nav=[["dashboard","📊 Dashboard"],["campaign","🚀 New campaign"],["contacts","👥 Contacts"],["templates","🗂️ Templates"],["sequences","💧 Sequences"],["journeys","🧭 Journeys"],["capture","🎣 Lead capture"],["integrations","🔗 Integrations"],["inbox","💬 Inbox"],["reports","📈 Reports"],["team","👤 Team"]];
  if(me.user.superadmin) nav.push(["admin","🛡️ Admin"]);
  const V={dashboard:Dashboard,campaign:Campaign,contacts:Contacts,templates:Templates,sequences:Sequences,journeys:Journeys,capture:Capture,integrations:Integrations,inbox:Inbox,reports:Reports,team:Team,admin:Admin,settings:Settings,affiliate:Affiliate}[view];
  const switchOrg=async id=>{await api("/api/auth/switch-org","POST",{org_id:id});loadMe();setView("dashboard");};
  const initials=(me.user.name||me.user.email||"?").trim()[0].toUpperCase();
  return <div style={{minHeight:"100vh",display:"flex",background:T.bg,color:T.text,fontFamily:"Inter,system-ui"}}>
    <aside style={{width:220,borderRight:`1px solid ${T.line}`,padding:"20px 12px",flexShrink:0}}>
      <div style={{padding:"0 8px 14px",display:"flex",alignItems:"center",gap:9}}>
        <img src="/static/logo.png" alt="" width="30" height="30" style={{borderRadius:8}}/>
        <div>
          <div style={{fontSize:18,fontWeight:800}}>Zen<span style={{background:T.grad,WebkitBackgroundClip:"text",color:"transparent"}}>Reach</span></div>
          <div style={{fontSize:10.5,color:T.dim,fontWeight:600}}>by NexZen</div>
        </div>
      </div>
      {nav.map(([id,l])=><div key={id} onClick={()=>setView(id)} style={{padding:"9px 12px",borderRadius:9,cursor:"pointer",fontSize:13,fontWeight:600,marginBottom:2,background:view===id?"rgba(79,124,255,.14)":"transparent",color:view===id?T.text:T.dim,borderLeft:view===id?`3px solid ${T.accent}`:"3px solid transparent"}}>{l}</div>)}
      <div style={{marginTop:18,padding:"0 8px",fontSize:11,color:T.dim}}>
        <div style={{marginBottom:4}}>Workspace</div>
        <select style={{...inp,fontSize:12,padding:"6px 8px"}} value={me.active_org||""} onChange={e=>switchOrg(e.target.value)}>{me.orgs.map(o=><option key={o.id} value={o.id}>{o.name} ({o.role})</option>)}</select>
        <a href="/whatsapp" style={{color:T.dim,display:"block",marginTop:8}}>Quick demo →</a>
      </div>
    </aside>
    <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>
      {/* top bar with profile icon */}
      <header style={{display:"flex",justifyContent:"flex-end",alignItems:"center",padding:"12px 24px",borderBottom:`1px solid ${T.line}`,position:"relative"}}>
        <div onClick={()=>setMenu(!menu)} title="Account" style={{width:34,height:34,borderRadius:"50%",background:T.grad,color:"#06101e",fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:15}}>{initials}</div>
        {menu && <div style={{position:"absolute",top:54,right:24,background:T.panel,border:`1px solid ${T.line}`,borderRadius:12,padding:8,minWidth:200,zIndex:20,boxShadow:"0 8px 30px rgba(0,0,0,.5)"}}>
          <div style={{padding:"8px 10px",borderBottom:`1px solid ${T.line}`,marginBottom:4}}>
            <div style={{fontSize:13,fontWeight:700}}>{me.user.name||"User"}</div>
            <div style={{fontSize:11.5,color:T.dim}}>{me.user.email}</div>
          </div>
          <div style={menuItem} onClick={()=>{setView("settings");setMenu(false);}}>⚙️ Settings</div>
          <div style={menuItem} onClick={()=>{setView("settings");setMenu(false);}}>💳 Billing</div>
          <div style={menuItem} onClick={()=>{setView("affiliate");setMenu(false);}}>🤝 Affiliate</div>
          <div style={{...menuItem,color:T.red}} onClick={async()=>{await api("/api/auth/logout","POST");loadMe();}}>↩ Log out</div>
        </div>}
      </header>
      <main style={{flex:1,padding:"24px 28px",maxWidth:1050,overflowY:"auto"}}>{view==="settings"?<Settings me={me}/>:<V/>}</main>
    </div>
  </div>;
}
const menuItem={padding:"9px 10px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600,color:T.text};
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
